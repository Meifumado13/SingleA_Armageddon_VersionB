<!-- Expected output: This page calculates the user's age based on the birth year entered and informs whether they are an adult or minor. It should display the computed age and a message. -->
<!doctype html>
<html>
  <head>
    <title>Age Calculator</title>
    <style>
      body {
        font-family: Arial;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      .result {
        margin-top: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Calculate Your Age</h1>
    <label for="yearInput">Enter your birth year:</label>
    <input type="text" id="yearInput" />
    <button onclick="showAge()">Compute Age</button>
    <div id="ageDisplay" class="result"></div>
    <script>
      // Function to compute age from birth year
      function computeAge(year) {
        var currentYear = new Date().getFullYear();
        return currentYear - year;
      }

      // Function to determine if the user is an adult
      function isAdult(age) {
        return age >= 18;
      }

      function showAge() {
        var input = document.getElementById("yearInput").value.trim();
        var year = parseInt(input, 10);

        // Proper NaN check
        if (Number.isNaN(year)) {
          document.getElementById("ageDisplay").innerText =
            "Please enter a valid birth year (numbers only).";
          return;
        }

        var age = computeAge(year);

        // Basic sanity check
        if (age < 0 || age > 130) {
          document.getElementById("ageDisplay").innerText =
            "That year doesn't look right. Try again.";
          return;
        }

        var message = "You are " + age + " years old.";
        message += isAdult(age) ? " You are an adult." : " You are a minor.";
        document.getElementById("ageDisplay").innerText = message;
      }

      // Optional: small safe console demo (kept clean)
      var sampleYears = [1990, 2000, 2010, "abc"];
      for (var i = 0; i < sampleYears.length; i++) {
        var yr = parseInt(sampleYears[i], 10);
        if (Number.isNaN(yr)) {
          console.log("Sample year invalid:", sampleYears[i]);
        } else {
          console.log("Sample year:", yr, "Age:", computeAge(yr));
        }
      }
    </script>
  </body>
</html>
